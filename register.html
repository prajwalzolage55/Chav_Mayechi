<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account — Chav Mayechi</title>
    <meta name="description" content="Create an account with Chav Mayechi to order authentic Maharashtrian delicacies." />
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Register — Chav Mayechi" />
    <meta property="og:description" content="Create an account with Chav Mayechi to order authentic Maharashtrian delicacies." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://chavmayechi.com/images/menu.png" />
    
    <link rel="icon" type="image/png" href="/images/logo.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Chav Mayechi</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS (Play CDN) -->
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        saffron: { DEFAULT: '#E8872E', light: '#FFB347', dark: '#D37215' },
                        'deep-brown': '#2E2017',
                        'warm-brown': '#4A3728',
                        'warm-brown-light': '#6B5646',
                        cream: '#FDFBF7',
                        'soft-green': '#4CAF50',
                    },
                    fontFamily: {
                        heading: ['Playfair Display', 'serif'],
                        headline: ['Noto Serif', 'Playfair Display', 'serif'],
                        body: ['Inter', 'sans-serif'],
                        label: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.383.0"></script>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary/20">

    <div id="navbar-placeholder"></div>

    <section class="min-h-screen pt-24 pb-12 flex items-center justify-center relative overflow-hidden">
        <!-- Decorative -->
        <div class="absolute top-0 left-0 w-1/2 h-full bg-primary/5 blur-3xl rounded-full -translate-x-1/2"></div>
        <div class="absolute bottom-0 right-0 w-1/2 h-1/2 bg-surface-container-high/5 blur-3xl rounded-full translate-x-1/2"></div>

        <div class="w-[90%] max-w-md relative z-10 opacity-0 translate-y-10 transition-all duration-700" id="register-card">
            <div class="bg-white/70 backdrop-blur-xl p-8 sm:p-10 rounded-3xl shadow-xl shadow-on-surface/5 border border-white/50">
                <div class="text-center mb-8">
                    <h1 class="font-headline text-3xl font-bold text-on-surface mb-2">Create Account</h1>
                    <p class="text-on-surface-variant text-sm">Join us for the authentic taste of home</p>
                </div>

                <form id="register-form" class="space-y-5">
                    <div>
                        <label class="text-sm font-semibold text-on-surface mb-1.5 block pl-1">Full Name</label>
                        <div class="relative">
                            <input type="text" id="name" required class="w-full pl-11 pr-4 py-3.5 bg-white rounded-xl border-2 border-transparent focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none transition-all text-on-surface placeholder:text-on-surface-variant/50" placeholder="John Doe">
                            <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/70 w-5 h-5"></i>
                        </div>
                    </div>

                    <div>
                        <label class="text-sm font-semibold text-on-surface mb-1.5 block pl-1">Email Address</label>
                        <div class="relative">
                            <input type="email" id="email" required class="w-full pl-11 pr-4 py-3.5 bg-white rounded-xl border-2 border-transparent focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none transition-all text-on-surface placeholder:text-on-surface-variant/50" placeholder="you@example.com">
                            <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/70 w-5 h-5"></i>
                        </div>
                    </div>

                    <div>
                        <label class="text-sm font-semibold text-on-surface mb-1.5 block pl-1">Password</label>
                        <div class="relative">
                            <input type="password" id="password" required class="w-full pl-11 pr-4 py-3.5 bg-white rounded-xl border-2 border-transparent focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none transition-all text-on-surface placeholder:text-on-surface-variant/50" placeholder="••••••••">
                            <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/70 w-5 h-5"></i>
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full mt-2 py-4 rounded-xl font-semibold text-white flex items-center justify-center gap-2 bg-gradient-to-r from-primary to-primary-container hover:-translate-y-0.5 hover:shadow-lg hover:shadow-primary/30 transition-all duration-300">
                        <span id="btn-text" class="flex items-center gap-2">Register <i data-lucide="arrow-right" class="w-5 h-5"></i></span>
                        <span id="loader" class="hidden animate-spin w-5 h-5 border-2 border-white border-t-transparent rounded-full"></span>
                    </button>
                </form>

                <div class="relative flex items-center py-5">
                    <div class="flex-grow border-t border-on-surface-variant/20"></div>
                    <span class="flex-shrink-0 mx-4 text-on-surface-variant text-sm font-semibold">OR</span>
                    <div class="flex-grow border-t border-on-surface-variant/20"></div>
                </div>

                <button type="button" id="google-login-btn" class="w-full py-3.5 rounded-xl font-semibold text-on-surface flex items-center justify-center gap-3 bg-white border border-on-surface-variant/20 hover:bg-surface-container-lowest hover:border-primary/50 transition-all duration-300 shadow-sm">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M5.266 9.765A7.077 7.077 0 0112 4.909c1.69 0 3.218.6 4.418 1.582L19.91 3C17.782 1.145 15.055 0 12 0 7.27 0 3.198 2.698 1.24 6.65l4.026 3.115z"/>
                        <path fill="#34A853" d="M16.04 18.013c-1.09.703-2.474 1.078-4.04 1.078a7.076 7.076 0 01-6.725-4.806l-4.04 3.127C3.365 21.258 7.42 24 12 24c3.395 0 6.491-1.227 8.705-3.515l-4.665-2.472z"/>
                        <path fill="#4A90E2" d="M19.98 12c0-.853-.115-1.621-.304-2.364H12v4.467h4.632c-.227 1.282-.937 2.39-1.954 3.107l4.665 2.472c2.723-2.512 4.637-6.22 4.637-10.154z"/>
                        <path fill="#FBBC05" d="M5.275 14.336A7.002 7.002 0 014.92 12c0-.822.148-1.61.408-2.35l-4.025-3.115A11.967 11.967 0 000 12c0 1.92.445 3.73 1.237 5.335l4.038-2.999z"/>
                    </svg>
                    Continue with Google
                </button>

                <p class="text-center text-sm text-on-surface-variant mt-8">
                    Already have an account? 
                    <a href="login.html" class="text-primary font-semibold hover:text-primary-container transition-colors">Sign In</a>
                </p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script type="module">
        import { registerUser, loginWithGoogle, onAuthChange } from './js/auth-service.js';
        import { initNavbar, initFooter, showToast } from './js/ui.js';

        const params = new URLSearchParams(window.location.search);
        const redirectUrl = params.get('redirect') || 'dashboard.html';

        // Redirect if already logged in
        onAuthChange((user) => {
            if (user) window.location.href = redirectUrl;
        });

        // Initialize UI
        initNavbar('navbar-placeholder');
        initFooter('footer-placeholder');
        lucide.createIcons();

        // Animate in
        const card = document.getElementById('register-card');
        setTimeout(() => {
            card.classList.remove('opacity-0', 'translate-y-10');
            card.classList.add('opacity-100', 'translate-y-0');
        }, 100);

        // Handle Registration
        const form = document.getElementById('register-form');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const loader = document.getElementById('loader');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;

            // Loading state
            submitBtn.disabled = true;
            btnText.classList.add('hidden');
            loader.classList.remove('hidden');

            const res = await registerUser(email, password, name);

            if (res.success) {
                showToast('Welcome to Chav Mayechi!');
                setTimeout(() => window.location.href = redirectUrl, 1500);
            } else {
                showToast(res.error || 'Failed to register', 'error');
                submitBtn.disabled = false;
                btnText.classList.remove('hidden');
                loader.classList.add('hidden');
            }
        });

        // Handle Google Login
        const googleBtn = document.getElementById('google-login-btn');
        googleBtn.addEventListener('click', async () => {
            const originalText = googleBtn.innerHTML;
            googleBtn.disabled = true;
            googleBtn.innerHTML = '<span class="animate-spin w-5 h-5 border-2 border-primary border-t-transparent rounded-full mr-2"></span> Signing in...';

            const res = await loginWithGoogle();

            if (res.success) {
                showToast('Welcome to Chav Mayechi!');
                setTimeout(() => window.location.href = redirectUrl, 1000);
            } else {
                showToast(res.error || 'Failed to sign in with Google', 'error');
                googleBtn.disabled = false;
                googleBtn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>

[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

# Block .git and dotfiles from being served
[[redirects]]
  from = "/.git/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.*"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"


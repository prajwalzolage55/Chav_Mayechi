<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Seed Products — Admin Only</title>
    <link rel="icon" type="image/png" href="/images/logo.webp?v=2" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex items-center justify-center p-8">

    <div class="max-w-2xl w-full mx-auto space-y-8">
        <div class="text-center">
            <span class="font-label text-xs uppercase tracking-[0.3em] text-primary font-bold block mb-4">Admin Tool</span>
            <h1 class="font-headline text-4xl font-bold text-on-surface mb-4">Seed Products</h1>
            <p class="text-secondary text-lg font-light">One-time tool to populate your Firestore <code class="bg-surface-container-low px-2 py-1 text-sm rounded">products</code> collection with all 22 items.</p>
        </div>

        <div class="bg-surface-container-low border border-primary/20 p-5 rounded-sm flex gap-3 items-start">
            <span class="material-symbols-outlined text-primary text-xl mt-0.5">warning</span>
            <div>
                <p class="text-sm text-on-surface font-medium">You must be logged in as an admin.</p>
                <p class="text-xs text-secondary mt-1">This script adds products to Firestore. It will skip products that already exist (matched by name).</p>
            </div>
        </div>

        <div id="status" class="hidden bg-surface-container p-6 rounded-sm border border-outline-variant/30 space-y-3 max-h-96 overflow-y-auto">
            <!-- Log messages appear here -->
        </div>

        <div class="flex gap-4 justify-center">
            <button id="seed-btn" onclick="seedProducts()"
                class="bg-primary text-on-primary px-10 py-4 font-bold text-sm uppercase tracking-widest hover:opacity-90 transition-all flex items-center gap-3">
                <span class="material-symbols-outlined">database</span>
                Seed All Products
            </button>
            <a href="products.html"
                class="border border-outline text-on-surface px-8 py-4 font-bold text-sm uppercase tracking-widest hover:bg-surface-container transition-all flex items-center gap-3">
                <span class="material-symbols-outlined">visibility</span>
                View Products
            </a>
        </div>
    </div>

    <script type="module" src="/js/seed-products.js"></script>
</body>
</html>

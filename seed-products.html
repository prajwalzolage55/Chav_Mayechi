        const statusDiv = document.getElementById('status');
        const seedBtn = document.getElementById('seed-btn');

        function log(message, type = 'info') {
            statusDiv.classList.remove('hidden');
            const colors = {
                info: 'text-secondary',
                success: 'text-green-700',
                error: 'text-red-600',
                warn: 'text-amber-600'
            };
            statusDiv.innerHTML += `<p class="text-sm ${colors[type] || 'text-secondary'}"><span class="material-symbols-outlined text-sm align-middle mr-1">${type === 'success' ? 'check_circle' : type === 'error' ? 'error' : type === 'warn' ? 'warning' : 'info'}</span>${message}</p>`;
            statusDiv.scrollTop = statusDiv.scrollHeight;
        }

        window.seedProducts = async function() {
            seedBtn.disabled = true;
            seedBtn.innerHTML = '<span class="animate-spin material-symbols-outlined">sync</span> Seeding...';

            try {
                // Check auth
                const user = auth.currentUser;
                if (!user) {
                    log('Not logged in! Please log in as admin first.', 'error');
                    seedBtn.disabled = false;
                    seedBtn.innerHTML = '<span class="material-symbols-outlined">database</span> Seed All Products';
                    return;
                }

                log(`Authenticated as ${user.email}`, 'info');

                // Get existing products to avoid duplicates
                const existingSnap = await getDocs(collection(db, 'products'));
                const existingNames = new Set();
                existingSnap.docs.forEach(doc => {
                    const data = doc.data();
                    if (data.name) existingNames.add(data.name);
                });

                log(`Found ${existingNames.size} existing products in Firestore`, 'info');

                let added = 0;
                let skipped = 0;

                for (const product of PRODUCTS) {
                    if (existingNames.has(product.name)) {
                        log(`Skipped "${product.name}" (already exists)`, 'warn');
                        skipped++;
                        continue;
                    }

                    await addDoc(collection(db, 'products'), {
                        ...product,
                        timestamp: serverTimestamp(),
                        active: true
                    });
                    log(`✓ Added "${product.name}" — ${product.price} ${product.unit}`, 'success');
                    added++;
                }

                log(`\nDone! Added ${added} products, skipped ${skipped}.`, 'success');
                log('Visit the Products page to see them live →', 'success');

            } catch (err) {
                log(`Error: ${err.message}`, 'error');
                console.error(err);
            }

            seedBtn.disabled = false;
            seedBtn.innerHTML = '<span class="material-symbols-outlined">database</span> Seed All Products';
        };

        // Check auth on load
        onAuthStateChanged(auth, (user) => {
            if (user) {
                log(`Logged in as: ${user.email}`, 'info');
            } else {
                log('Not logged in. Please <a href="login.html" class="text-primary underline">login as admin</a> first.', 'warn');
            }
        });

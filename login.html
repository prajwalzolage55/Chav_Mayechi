<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Login to your Chav Mayechi account." />
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Login — Chav Mayechi" />
    <meta property="og:description" content="Login to your Chav Mayechi account." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://chavmayechi.com/images/menu.png" />
    
    <link rel="icon" type="image/png" href="/images/logo.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Chav Mayechi</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS (Play CDN) -->
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        saffron: { DEFAULT: '#E8872E', light: '#FFB347', dark: '#D37215' },
                        'deep-brown': '#2E2017',
                        'warm-brown': '#4A3728',
                        'warm-brown-light': '#6B5646',
                        cream: '#FDFBF7',
                        'soft-green': '#4CAF50',
                    },
                    fontFamily: {
                        heading: ['Playfair Display', 'serif'],
                        headline: ['Noto Serif', 'Playfair Display', 'serif'],
                        body: ['Inter', 'sans-serif'],
                        label: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.383.0"></script>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary/20">

    <div id="navbar-placeholder"></div>

    <section class="min-h-screen pt-24 pb-12 flex items-center justify-center relative overflow-hidden">
        <!-- Decorative -->
        <div class="absolute top-0 right-0 w-1/2 h-full bg-primary/5 blur-3xl rounded-full translate-x-1/2"></div>
        <div class="absolute bottom-0 left-0 w-1/2 h-1/2 bg-surface-container-high/5 blur-3xl rounded-full -translate-x-1/2"></div>

        <div class="w-[90%] max-w-md relative z-10 opacity-0 translate-y-10 transition-all duration-700" id="login-card">
            <div class="bg-white/70 backdrop-blur-xl p-8 sm:p-10 rounded-3xl shadow-xl shadow-on-surface/5 border border-white/50">
                <div class="text-center mb-8">
                    <h1 class="font-headline text-3xl font-bold text-on-surface mb-2">Welcome Back</h1>
                    <p class="text-on-surface-variant text-sm">Sign in to manage your orders</p>
                </div>

                <form id="login-form" class="space-y-5">
                    <div>
                        <label class="text-sm font-semibold text-on-surface mb-1.5 block pl-1">Email Address</label>
                        <div class="relative">
                            <input type="email" id="email" required class="w-full pl-11 pr-4 py-3.5 bg-white rounded-xl border-2 border-transparent focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none transition-all text-on-surface placeholder:text-on-surface-variant/50" placeholder="you@example.com">
                            <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/70 w-5 h-5"></i>
                        </div>
                    </div>

                    <div>
                        <label class="text-sm font-semibold text-on-surface mb-1.5 block pl-1">Password</label>
                        <div class="relative">
                            <input type="password" id="password" required class="w-full pl-11 pr-12 py-3.5 bg-white rounded-xl border-2 border-transparent focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none transition-all text-on-surface placeholder:text-on-surface-variant/50" placeholder="••••••••">
                            <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/70 w-5 h-5"></i>
                            <button type="button" id="toggle-password" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/70 hover:text-on-surface transition-colors focus:outline-none">
                                <i data-lucide="eye" id="eye-icon" class="w-5 h-5"></i>
                                <i data-lucide="eye-off" id="eye-off-icon" class="w-5 h-5 hidden"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full mt-2 py-4 rounded-xl font-semibold text-white flex items-center justify-center gap-2 bg-gradient-to-r from-primary to-primary-container hover:-translate-y-0.5 hover:shadow-lg hover:shadow-primary/30 transition-all duration-300">
                        <span id="btn-text" class="flex items-center gap-2">Sign In <i data-lucide="arrow-right" class="w-5 h-5"></i></span>
                        <span id="loader" class="hidden animate-spin w-5 h-5 border-2 border-white border-t-transparent rounded-full"></span>
                    </button>
                </form>

                <p class="text-center text-sm text-on-surface-variant mt-8">
                    Don't have an account? 
                    <a href="register.html" class="text-primary font-semibold hover:text-primary-container transition-colors">Create one</a>
                </p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script type="module">
        import { loginUser, onAuthChange } from './js/auth-service.js';
        import { initNavbar, initFooter, showToast } from './js/ui.js';

        const params = new URLSearchParams(window.location.search);
        const redirectUrl = params.get('redirect') || 'dashboard.html';

        // Redirect if already logged in
        onAuthChange((user) => {
            if (user) window.location.href = redirectUrl;
        });

        // Initialize UI
        initNavbar('navbar-placeholder');
        initFooter('footer-placeholder');
        lucide.createIcons();

        // Animate in
        const card = document.getElementById('login-card');
        setTimeout(() => {
            card.classList.remove('opacity-0', 'translate-y-10');
            card.classList.add('opacity-100', 'translate-y-0');
        }, 100);

        // Password Visibility Toggle
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');
        const eyeOffIcon = document.getElementById('eye-off-icon');

        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if (type === 'text') {
                eyeIcon.classList.add('hidden');
                eyeOffIcon.classList.remove('hidden');
            } else {
                eyeIcon.classList.remove('hidden');
                eyeOffIcon.classList.add('hidden');
            }
        });

        // Handle Login
        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const loader = document.getElementById('loader');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Loading state
            submitBtn.disabled = true;
            btnText.classList.add('hidden');
            loader.classList.remove('hidden');

            const res = await loginUser(email, password);

            if (res.success) {
                showToast('Welcome back!');
                setTimeout(() => window.location.href = redirectUrl, 1000);
            } else {
                showToast(res.error || 'Failed to login', 'error');
                submitBtn.disabled = false;
                btnText.classList.remove('hidden');
                loader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
